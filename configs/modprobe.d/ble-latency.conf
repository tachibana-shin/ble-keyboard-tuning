# Install this file as /etc/modprobe.d/ble-latency.conf only after the patched
# bluetooth.ko is installed. See docs/kernel-patch.md.
#
# The patch is opt-in and disabled by default. When enabled, it rejects L2CAP
# connection parameter updates that request non-zero slave latency.
#
# Replace the placeholder with the real keyboard MAC. Keep the real MAC out of
# this repository. Leaving the MAC value empty applies the policy to all LE
# devices.
options bluetooth reject_le_latency=1 reject_le_latency_mac=10:11:89:XX:XX:XX
